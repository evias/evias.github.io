### Site Settings ###
title               : "Grégory Saive - eVias"
description         : >-
                      Hi, I am Grégory Saive!<br />Software developer &amp; Author;<br />Hobbies: Mountains, Racing, Dogs
baseurl             : "" # empty quotes for *.github.io
repository          : evias/evias.github.io
remote_theme        : YoussefRaafatNasry/portfolYOU

### Plugins ###
plugins:
  - jemoji
  - jekyll-feed

### Navbar Settings ###
nav_exclude:
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - pages/privacy-policy.md
  - pages/terms-of-service.md

### Author Info ###
author:
  name              : Grégory Saive
  image             : /assets/evias_with_marley_and_maya.png
  email             : greg@evi.as
  facebook          : resoftwaresl
  github            : evias
  linkedin          : resoftwaresl
  twitter           : evias
  youtube           : channel/UCnyWf1c2Gt8XjwliO-jz6gA
  keybase           : evias

buymeacoffee:
  enabled: true
  username: evias
  description: "Buy me a pizza!"

### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name

### Analytics ###
analytics:
  enabled: true
  google:
    tracking_id: G-T8RZ5ZCQN9

### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false

### RSS feed customization
feed:
  icon: /assets/evias_with_marley_and_maya.png
  logo: /assets/evias_with_marley_and_maya.png
  collections:
    - blog
    - projects

### Exclude from processing ###
exclude:
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
